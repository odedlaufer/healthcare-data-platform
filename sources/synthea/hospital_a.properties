# Synthea settings for Hospital A (FR-SRC1). Seeds, population and reference date are passed on
# the command line by `make synthea`, so the same inputs always produce identical patient files.

exporter.baseDirectory = /output/
exporter.years_of_history = 10
exporter.metadata.export = true

exporter.fhir.export = true
exporter.fhir.use_us_core_ig = true
exporter.fhir.us_core_version = 6.1.0
exporter.fhir.transaction_bundle = true
exporter.fhir.bulk_data = false
exporter.hospital.fhir.export = true
exporter.practitioner.fhir.export = true

# Only the resource types the platform uses (PRD section 4), plus what they reference.
# Billing (Claim, ExplanationOfBenefit) and Provenance are about half the volume and unused.
# DiagnosticReport is required: Synthea only emits DocumentReference notes alongside it.
exporter.fhir.included_resources = Patient,Encounter,Condition,Observation,MedicationRequest,Procedure,Immunization,DiagnosticReport,DocumentReference,Organization,Location,Practitioner,PractitionerRole

exporter.ccda.export = false
exporter.csv.export = false
exporter.text.export = false
exporter.clinical_note.export = false

generate.only_alive_patients = false

# Plain names (no numeric suffixes such as "Ima629"): realistic for patient matching (FR-MPI)
# and for note scrubbing (FR-DE4). All data stays synthetic.
generate.append_numbers_to_person_names = false
