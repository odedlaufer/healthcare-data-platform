name: governance

on:
  pull_request:
    paths:
      - "governance/**"
      - "airflow/**"
      - "tests/governance/**"
      - "tests/infra/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/governance.yml"
  push:
    branches: [main]
    paths:
      - "governance/**"
      - "airflow/**"
      - "tests/governance/**"
      - "tests/infra/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/governance.yml"

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: permission matrix and services
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start the core stack (secrets, Postgres, SeaweedFS, buckets, migrations)
        run: make up
      - name: Roll back every migration, then re-apply
        run: |
          for _ in governance/migrations/*.sql; do docker compose run --rm migrate rollback; done
          docker compose run --rm migrate up
      - name: Assert the permission matrix and core services
        run: make test-integration
      - name: Start Airflow
        run: make airflow-up
      - name: Assert Airflow
        run: make test-airflow
      - name: Service logs on failure
        if: failure()
        run: docker compose --profile core --profile airflow logs --tail 200
