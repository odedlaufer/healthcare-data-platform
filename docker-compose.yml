name: hdp

x-airflow: &airflow
  profiles: [airflow]
  image: apache/airflow:3.4.0-python3.12
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /tmp/simple_auth_manager_passwords.json
    AIRFLOW__API_AUTH__JWT_ISSUER: hdp
    # Secrets are read from Docker secrets at runtime; none are passed as environment values.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
      sh -c 'printf "postgresql+psycopg://airflow:%s@postgres:5432/airflow" "$$(cat /run/secrets/airflow_db_password)"'
    AIRFLOW__CORE__FERNET_KEY_CMD: cat /run/secrets/airflow_fernet_key
    AIRFLOW__API__SECRET_KEY_CMD: cat /run/secrets/airflow_api_secret_key
    AIRFLOW__API_AUTH__JWT_SECRET_CMD: cat /run/secrets/airflow_jwt_secret
  secrets:
    - airflow_db_password
    - airflow_fernet_key
    - airflow_api_secret_key
    - airflow_jwt_secret
    - airflow_admin_passwords
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    profiles: [core]
    build:
      context: governance/postgres
    image: hdp/postgres:16.16-pgaudit
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - pgaudit.log=role,ddl
      - -c
      - pgaudit.log_relation=on
      - -c
      - pgaudit.log_catalog=off
      - -c
      - "log_line_prefix=%m [%p] user=%u db=%d app=%a "
    environment:
      POSTGRES_USER: hdp_admin
      POSTGRES_DB: healthcare
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:45432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdp_admin -d healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    mem_limit: 1g
    restart: unless-stopped

  migrate:
    profiles: [core]
    image: ghcr.io/amacneil/dbmate:2.37.0
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
    volumes:
      - ./governance/migrations:/db/migrations:ro
    environment:
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    entrypoint:
      - /bin/sh
      - -c
      - 'export DATABASE_URL="postgres://hdp_admin:$$(cat /run/secrets/postgres_password)@postgres:5432/healthcare?sslmode=disable" && exec dbmate "$$@"'
      - dbmate
    command: [up]
    restart: "no"

  airflow-db-init:
    profiles: [core]
    image: hdp/postgres:16.16-pgaudit
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/hdp/init_airflow_db.sh"]
    secrets:
      - postgres_password
      - airflow_db_password
    volumes:
      - ./governance/postgres:/opt/hdp:ro
    restart: "no"

  seaweedfs:
    profiles: [core]
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    entrypoint: ["/bin/sh", "/opt/hdp/entrypoint.sh"]
    environment:
      # Go GC soft target below the container limit (Lichess was OOM-killed at 1 GB during uploads).
      GOMEMLIMIT: 1536MiB
    secrets:
      - s3_access_key
      - s3_secret_key
    ports:
      - "127.0.0.1:48333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./governance/storage:/opt/hdp:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    mem_limit: 2g
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    # Root only to hand the logs volume to AIRFLOW_UID; then runs the schema migration and exits.
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        exec /entrypoint airflow db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    # SimpleAuthManager opens its password file for writing; give it a private copy of the secret.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        install -m 600 /run/secrets/airflow_admin_passwords /tmp/simple_auth_manager_passwords.json
        exec /entrypoint airflow api-server
    ports:
      - "127.0.0.1:48080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "-o", "/dev/null", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1g

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 2g

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1g

  airflow-triggerer:
    <<: *airflow
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 768m

  hapi-db:
    profiles: [fhir]
    image: postgres:16.16
    # The hospital EHR's own database: separate from the platform warehouse, not published.
    environment:
      POSTGRES_USER: hapi
      POSTGRES_DB: hapi
      POSTGRES_PASSWORD_FILE: /run/secrets/hapi_db_password
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    secrets:
      - hapi_db_password
    volumes:
      - hapi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    mem_limit: 1g
    restart: unless-stopped

  hapi:
    profiles: [fhir]
    build:
      context: sources/hapi
    image: hdp/hapi:v8.12.0-2
    depends_on:
      hapi-db:
        condition: service_healthy
    environment:
      # Spring reads the DB password from the secret file named after the property (configtree).
      spring.config.import: configtree:/run/secrets/
      spring.datasource.url: jdbc:postgresql://hapi-db:5432/hapi
      spring.datasource.username: hapi
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      spring.jpa.properties.hibernate.search.enabled: "false"
      hapi.fhir.fhir_version: R4
      hapi.fhir.bulk_export_enabled: "true"
      hapi.fhir.cr.enabled: "false"
      hapi.fhir.mdm_enabled: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    secrets:
      - source: hapi_db_password
        target: spring.datasource.password
    ports:
      - "127.0.0.1:48090:8080"
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/opt/hdp/health", "Health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    mem_limit: 3g
    restart: unless-stopped

  synthea:
    profiles: [fhir]
    build:
      context: sources/synthea
    image: hdp/synthea:4.0.0
    user: "${HOST_UID:-1000}"
    volumes:
      - ./sources/synthea/hospital_a.properties:/config/hospital_a.properties:ro
      - ./data/synthea/hospital_a:/output
    mem_limit: 4g
    restart: "no"

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  s3_access_key:
    file: ./secrets/s3_access_key
  s3_secret_key:
    file: ./secrets/s3_secret_key
  airflow_db_password:
    file: ./secrets/airflow_db_password
  airflow_fernet_key:
    file: ./secrets/airflow_fernet_key
  airflow_api_secret_key:
    file: ./secrets/airflow_api_secret_key
  airflow_jwt_secret:
    file: ./secrets/airflow_jwt_secret
  airflow_admin_passwords:
    file: ./secrets/airflow_admin_passwords.json
  hapi_db_password:
    file: ./secrets/hapi_db_password

volumes:
  pgdata:
  seaweedfs-data:
  airflow-logs:
  hapi-pgdata:
