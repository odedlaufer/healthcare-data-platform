[project]
name = "healthcare-data-platform"
version = "0.1.0"
description = "Governed healthcare data platform: FHIR -> patient matching -> de-identification -> OMOP CDM 5.4"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.3.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: needs the running Postgres (docker compose --profile core up)", "airflow: needs the running Airflow (make airflow-up)"]

[dependency-groups]
dev = [
    "boto3>=1.44.11",
    "boto3-stubs[s3]>=1.44.11",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
